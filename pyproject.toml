[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unpack"
version = "0.1.0"
description = "Android unpacker: scan → dump → repair → verify"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
frida = ["frida>=16.0", "frida-tools>=12.0"]
analysis = ["androguard>=4.1", "lief>=0.14"]
all = ["unpack[frida,analysis]"]
dev = ["pytest", "ruff"]

[project.scripts]
unpack = "unpack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/unpack"]

[tool.ruff]
target-version = "py310"
line-length = 100
