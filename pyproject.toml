[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unpack"
dynamic = ["version"]
description = "Android APK unpacker & mobile reverse-engineering workbench: scan → inspect → dump → repair → verify → report"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "0xaf" },
]
keywords = [
    "android",
    "apk",
    "dex",
    "unpacker",
    "reverse-engineering",
    "mobile-security",
    "frida",
    "ebpf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
frida = ["frida>=16.0", "frida-tools>=12.0"]
analysis = ["androguard>=4.1", "lief>=0.14", "cryptography>=41.0"]
web = ["flask>=3.0"]
all = ["unpack[frida,analysis,web]"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/overkazaf/unpack"
Repository = "https://github.com/overkazaf/unpack"
Documentation = "https://overkazaf.github.io/unpack/"
Issues = "https://github.com/overkazaf/unpack/issues"

[project.scripts]
unpack = "unpack.cli:app"
unpack-web = "unpack.web:main"

[tool.hatch.version]
path = "src/unpack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
